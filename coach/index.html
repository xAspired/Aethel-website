<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethel Coach Studio</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap">
<style>
/* Layout: tre colonne desktop — libreria schede | editor scheda | catalogo esercizi. Token = tema "Standard" dell'app. */
:root{
  --cream:#FAF8F4; --card:#FFFEFB; --white:#FFFFFF;
  --accent:#F07C3A; --accent-light:#FEF0E7; --accent-mid:#FBDCC8;
  --lilac:#9B8EC4; --lilac-light:#F0EDF9; --sage:#7BA68A; --sage-light:#EBF3EE; --coral:#E8715A; --coral-light:#FDECEA;
  --t1:#1A1714; --t2:#6B6560; --t3:#A8A29C;
  --border:rgba(26,23,20,.08); --border-med:rgba(26,23,20,.14);
  --shadow:0 1px 2px rgba(26,23,20,.04),0 6px 20px rgba(26,23,20,.05);
  --serif:'DM Serif Display',Georgia,serif; --sans:'DM Sans',-apple-system,'Segoe UI',sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
}
@media (prefers-color-scheme:dark){:root{
  --cream:#17141A; --card:#211D25; --white:#2A2530;
  --accent:#F28A4C; --accent-light:#3A2618; --accent-mid:#5A3720;
  --lilac:#A99BDA; --lilac-light:#2D2840; --sage:#8DBB9C; --sage-light:#1E2E24; --coral:#EE8670; --coral-light:#3A2220;
  --t1:#F3EFEA; --t2:#B8B0A8; --t3:#7C746D;
  --border:rgba(255,255,255,.07); --border-med:rgba(255,255,255,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--t1);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;height:100vh}

/* ── Sidebar ── */
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--cream)}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 16px}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{font:22px/1 var(--serif);font-weight:400;display:block}
.brand small{color:var(--t3);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.gym{margin:0 16px 14px;padding:10px 12px;border-radius:var(--r-md);background:var(--accent-light);color:var(--accent);font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.gym span{color:var(--t2);font-weight:500}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 8px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600}
.side-search{margin:0 16px 8px}
.lib{flex:1;overflow:auto;padding:0 10px 16px;display:flex;flex-direction:column;gap:2px}
.lib-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:left;width:100%}
.lib-item:hover{background:var(--white)}
.lib-item.on{background:var(--card);box-shadow:var(--shadow)}
.lib-item .em{width:32px;height:32px;border-radius:9px;background:var(--accent-light);display:grid;place-items:center;font-size:16px;flex:none}
.lib-item .tx{min-width:0;flex:1}
.lib-item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item .meta{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clients{display:flex;flex-direction:column;gap:2px;padding:0 10px 6px;max-height:42%;overflow:auto;flex:none}
.cl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:left;width:100%}
.cl:hover{background:var(--white)}
.cl.on{background:var(--t1);color:var(--cream)}
.cl.on .cnt{color:var(--cream);background:rgba(255,255,255,.15)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:#fff}
.cl .cn2{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:11px;font-weight:700;color:var(--t3);background:var(--white);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.add-client{display:flex;gap:6px;padding:0 16px 8px}
.add-client .field{padding:7px 10px}
.client-head{margin:4px 16px 8px;padding:12px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.client-head input{border:0;background:none;outline:none;font:20px/1.2 var(--serif);width:100%;padding:0}
.client-head .row{gap:6px}
.divider{height:1px;background:var(--border);margin:6px 16px 8px}
.client-sel{max-width:280px;appearance:auto}
.lib-empty{color:var(--t3);font-size:13px;padding:10px}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:6px;font-size:12px;color:var(--t3);align-items:center;justify-content:space-between}

/* ── Controls ── */
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--white);border:1px solid var(--border-med);transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--white)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.danger{color:var(--coral)}
.icon-btn{width:30px;height:30px;border-radius:9px;border:0;background:none;color:var(--t3);display:grid;place-items:center;font-size:15px}
.icon-btn:hover{background:var(--accent-light);color:var(--accent)}
.field{width:100%;border:1px solid var(--border-med);background:var(--white);border-radius:var(--r-sm);padding:9px 12px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--accent);color:#fff}

/* ── Editor ── */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:16px 28px;border-bottom:1px solid var(--border)}
.top .crumbs{flex:1;color:var(--t3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .saved{font-size:12px;color:var(--sage);font-weight:600}
.editor{flex:1;overflow:auto;padding:26px 28px 120px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;gap:16px;align-items:flex-start}
.emoji-pick{width:64px;height:64px;border-radius:18px;background:var(--accent-light);border:0;font-size:30px;flex:none;position:relative}
.head-fields{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.title-in{border:0;background:none;outline:none;font:34px/1.1 var(--serif);padding:2px 0;width:100%;border-bottom:1px dashed transparent}
.title-in:focus{border-bottom-color:var(--accent-mid)}
.title-in::placeholder{color:var(--t3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.client-in{max-width:280px}
.stats{display:flex;gap:18px;color:var(--t2);font-size:13px}
.stats b{color:var(--t1);font-variant-numeric:tabular-nums}
.emoji-pop{position:absolute;top:70px;left:0;z-index:20;background:var(--card);border:1px solid var(--border-med);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(6,36px);gap:4px}
.emoji-pop button{border:0;background:none;font-size:20px;border-radius:8px;height:36px}
.emoji-pop button:hover{background:var(--accent-light)}

.selbar{position:sticky;top:-26px;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--t1);color:var(--cream);border-radius:var(--r-md);box-shadow:var(--shadow)}
.selbar .btn{background:transparent;border-color:rgba(255,255,255,.25);color:inherit}
.selbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.selbar span{flex:1;font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);display:grid;grid-template-columns:auto 84px minmax(0,1fr) auto;gap:14px;padding:12px 14px 12px 8px;align-items:start;transition:box-shadow .15s,border-color .15s}
.ex.drag-over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.ex.dragging{opacity:.4}
.ex.sel{border-color:var(--lilac);box-shadow:0 0 0 3px var(--lilac-light)}
.grip{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.grip .handle{cursor:grab;color:var(--t3);font-size:14px;letter-spacing:-2px;user-select:none;padding:2px}
.grip input{accent-color:var(--lilac);width:16px;height:16px;margin:0}
.thumb{width:84px;height:56px;border-radius:10px;object-fit:cover;background:var(--accent-light)}
.ex-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ex-name{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-name .mus{font-weight:500;font-size:12px;color:var(--t3)}
.params{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pf{display:flex;align-items:center;background:var(--cream);border:1px solid var(--border);border-radius:999px;padding:2px 4px 2px 12px;gap:6px}
.pf label{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pf input{width:56px;border:0;background:none;outline:none;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;padding:5px 0}
.pf input.wide{width:72px}
.step{width:24px;height:24px;border-radius:50%;border:0;background:var(--white);color:var(--t2);font-weight:700;line-height:1}
.step:hover{background:var(--accent);color:#fff}
.pf.locked{opacity:.55}
.notes{border:0;background:none;resize:none;outline:none;font-size:13px;color:var(--t2);padding:2px 0;min-height:22px;width:100%;border-bottom:1px dashed var(--border-med)}
.notes:focus{border-bottom-color:var(--accent);color:var(--t1)}
.ex-actions{display:flex;flex-direction:column;gap:2px}

.group{border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--lilac-light);border:1px solid color-mix(in srgb,var(--lilac) 30%,transparent)}
.group.emom{background:var(--sage-light);border-color:color-mix(in srgb,var(--sage) 35%,transparent)}
.group-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 6px}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--lilac);color:#fff}
.emom .badge{background:var(--sage)}
.group-h .pf{background:var(--card)}
.group-h .sp{flex:1}
.member-tag{font-size:11px;font-weight:700;color:var(--lilac);background:var(--lilac-light);padding:2px 7px;border-radius:6px}
.emom .member-tag{color:var(--sage);background:var(--sage-light)}

.empty{border:1.5px dashed var(--border-med);border-radius:var(--r-lg);padding:46px 24px;text-align:center;color:var(--t2)}
.empty h3{font:24px var(--serif);font-weight:400;margin:0 0 6px;color:var(--t1)}

.dock{position:sticky;bottom:0;padding:14px 28px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px}
.dock .hint{flex:1;color:var(--t3);font-size:12px}
.code-chip{font:600 13px/1 ui-monospace,'SF Mono',Menlo,monospace;background:var(--white);border:1px solid var(--border-med);border-radius:999px;padding:8px 12px;letter-spacing:.06em}

/* ── Catalogue ── */
.cat{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--card)}
.cat-h{flex:none;padding:18px 18px 10px;display:flex;flex-direction:column;gap:10px}
.cat-h .seg{align-self:flex-start}
.cat-h h2{font:22px var(--serif);font-weight:400;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.cat-h h2 small{font:500 12px var(--sans);color:var(--t3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-med);background:var(--white);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--t2)}
.chip.on{background:var(--t1);border-color:var(--t1);color:var(--cream)}
.cat-list{flex:1;min-height:0;overflow:auto;padding:4px 12px 20px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:10px;align-content:start}
.card{flex:none;min-height:max-content;border:1px solid var(--border);background:var(--white);border-radius:var(--r-md);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--accent-light);display:block}
.card .ci{padding:8px 10px 10px}
.card .cn{font-weight:600;font-size:13px;line-height:1.25}
.card .cm{font-size:11px;color:var(--t3);margin-top:2px}
.card .plus{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;opacity:0;transition:opacity .12s}
.card:hover .plus{opacity:1}
.card .count{position:absolute;top:8px;left:8px;background:var(--t1);color:var(--cream);font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}

/* ── Modal / toast ── */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.38);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:28px;padding:30px;width:min(460px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:16px;text-align:center}
.modal h3{font:28px var(--serif);font-weight:400;margin:0}
.modal p{margin:0;color:var(--t2)}
.big-code{font:600 40px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:var(--accent);background:var(--accent-light);border-radius:18px;padding:22px 10px;user-select:all}
.modal .row{justify-content:center}
.msg-box{text-align:left;font-size:13px;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;color:var(--t2);white-space:pre-wrap}
.spinner{width:34px;height:34px;border:3px solid var(--accent-mid);border-top-color:var(--accent);border-radius:50%;margin:16px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--t1);color:var(--cream);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.err{color:var(--coral);font-weight:600}
.history{text-align:left;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--t2)}
.history div{display:flex;justify-content:space-between}

.app.no-cat{grid-template-columns:270px minmax(0,1fr)}
.app.no-cat .cat{display:none}
.view{display:flex;flex-direction:column;flex:1;min-height:0}
/* sidebar nav */
.side-scroll{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:left;font-weight:600;width:100%;color:var(--t2)}
.nav-item:hover{background:var(--white);color:var(--t1)}
.nav-item.on{background:var(--card);color:var(--t1);box-shadow:var(--shadow)}
.nav-item .ic{width:28px;text-align:center;font-size:15px}
.new-main{margin:0 16px 10px;width:calc(100% - 32px)}
.sec{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 4px}
.add-mini{border:0;background:none;color:var(--t3);font-weight:700;font-size:16px;width:24px;height:24px;border-radius:7px}
.add-mini:hover{background:var(--accent-light);color:var(--accent)}
.see-all{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;text-align:left;padding:4px 10px 6px}
.see-all:hover{text-decoration:underline}
.fd-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--lilac-light);font-size:14px;flex:none}
.side-empty{color:var(--t3);font-size:12px;padding:2px 10px 6px}
/* pages */
.page{flex:1;overflow:auto;padding:34px 40px 60px}
.page-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hello h1{font:44px/1.05 var(--serif);font-weight:400;margin:0;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--t2)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px}
.kpi b{display:block;font:34px/1 var(--serif);font-weight:400;font-variant-numeric:tabular-nums}
.kpi span{color:var(--t3);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.block{display:flex;flex-direction:column;gap:12px}
.block-h{display:flex;justify-content:space-between;align-items:baseline}
.block-h h2{font:26px var(--serif);font-weight:400;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .12s,box-shadow .12s;min-width:0}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .tt{display:flex;gap:12px;align-items:center;min-width:0}
.tile .tn{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tx{min-width:0;flex:1}
.av.lg{width:40px;height:40px;font-size:14px}
.fd-ic.lg{width:40px;height:40px;font-size:20px;border-radius:12px}
.em-lg{width:40px;height:40px;border-radius:12px;background:var(--accent-light);display:grid;place-items:center;font-size:20px;flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--cream);color:var(--t2);border:1px solid var(--border);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.sent{background:var(--sage-light);color:var(--sage);border-color:transparent}
.pill.fd{background:var(--lilac-light);color:var(--lilac);border-color:transparent}
.codes{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.code-row{display:grid;grid-template-columns:130px minmax(0,1fr) 150px 110px;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--border)}
.code-row:first-child{border-top:0}
.code-row .cc{font:600 15px ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.06em;color:var(--accent)}
.code-row.exp .cc{color:var(--t3);text-decoration:line-through}
.code-row .cw{min-width:0}
.code-row .cw b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-row .cw span,.code-row .cd{font-size:12px;color:var(--t3)}
.code-row .cd{font-variant-numeric:tabular-nums}
.code-row button{justify-self:end}

<script>
// ───────────────────────────────────────────────
//  CONFIG — palestra e backend.
//  Nessun server: il sito chiama direttamente l'RPC Supabase
//  create_workout_code (aperta ad anon), la stessa usata dall'app.
// ───────────────────────────────────────────────
const CONFIG = {
  gymName: 'Caligram Gym',
  supabaseUrl: 'https://jvcukyfucvwxegwagoul.supabase.co',
  supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2Y3VreWZ1Y3Z3eGVnd2Fnb3VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTE0MzgsImV4cCI6MjA5NzI2NzQzOH0.M8xb7552R4zkAJ0OgD7yW8oaGIA-ug474K57Cjgt_OA',
  codeTtlDays: 30,
};
const SHARE_FORMAT = '2.0';
const STORE_KEY = 'aethel-coach-studio-v1';

const CAT = window.AETHEL_CATALOGUE || [];
const CAT_BY_ID = Object.fromEntries(CAT.map(e => [e.id, e]));
// Tenute isometriche: stessa lista di isHoldExercise nell'app. Le reps diventano "30s".
const isHold = id => !!CAT_BY_ID[id]?.hold;
const holdSecs = r => parseInt(String(r||'').replace(/[^0-9]/g,'')) || 30;
const MUSCLES = {
  it:{chest:'Petto',back:'Dorsali',shoulders:'Spalle',biceps:'Bicipiti',triceps:'Tricipiti',forearms:'Avambracci',abs:'Addome',obliques:'Obliqui',traps:'Trapezi',lats:'Dorsali',lowerBack:'Lombari',glutes:'Glutei',quads:'Quadricipiti',hamstrings:'Femorali',calves:'Polpacci',hipFlexors:'Flessori anca'},
  en:{chest:'Chest',back:'Back',shoulders:'Shoulders',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',traps:'Traps',lats:'Lats',lowerBack:'Lower back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Calves',hipFlexors:'Hip flexors'},
};
const MUSCLE_ORDER = ['chest','shoulders','lats','traps','biceps','triceps','forearms','abs','lowerBack','glutes','quads','hamstrings','calves','hipFlexors'];
const TYPES = [['bodybuilding','Pesi'],['calisthenics','Calisthenics'],['hybrid','Ibrido'],['recovery','Recupero']];
const EMOJIS = ['🏋️','💪','🔥','⚡','🦵','🎯','🤸','🧱','🦍','🏆','🚀','🧘','🥇','🦅','⛰️','🌀','💥','❤️'];

// ── Stato ──
var state = load() || seed();
let ui = { histType:'all', stFilter:'all', selected:new Set(), catFilter:'all', muscle:null, q:'', emojiOpen:false, view:'home', libTab:'clients', libSel:null, libQ:'', prevView:'home' };
migrate();
// Clienti: entità proprie (id, nome). Le schede vecchie con `client` testuale vengono convertite.
function migrate(){
  state.clients = state.clients || [];
  state.exerciseDefaults = state.exerciseDefaults || {}; // exerciseId -> link video tutorial di default
  state.folders = state.folders || [];
  state.history = state.history || [];
  for (const c of state.clients) if (!c.status) c.status = state.workouts.some(w=>w.clientId===c.id && w.codes?.length) ? 'sent' : 'todo';
  for (const w of state.workouts){
    if (w.client && !w.clientId){
      let c = state.clients.find(c=>c.name.toLowerCase()===w.client.trim().toLowerCase());
      if (!c){ c = {id:uid('c'), name:w.client.trim(), createdAt:Date.now()}; state.clients.push(c); }
      w.clientId = c.id;
    }
    delete w.client;
  }
}
const clientOf = w => state.clients.find(c=>c.id===w?.clientId);
const clientName = w => clientOf(w)?.name || '';
const folderOf = w => state.folders.find(f=>f.id===w?.folderId);
const folderName = w => folderOf(w)?.name || '';
const AV_COLORS = ['#F07C3A','#9B8EC4','#7BA68A','#E8715A','#2F7DC9','#E06B8A','#4F8A5B','#C9A23F'];
const avColor = id => AV_COLORS[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
const initials = n => n.trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('') || '?';
let delArmed2 = null; // conferma eliminazione cliente/cartella

// Etichette di stato del cliente
const STATUS = {
  todo:  { l:'Da creare',     c:'#A8A29C' },
  edit:  { l:'Da modificare', c:'#E8715A' },
  ready: { l:'Pronta',        c:'#9B8EC4' },
  sent:  { l:'Inviata',       c:'#5A8A6A' },
  pause: { l:'In pausa',      c:'#C9A23F' },
};
const stOf = c => STATUS[c?.status] || STATUS.todo;
const statusPill = c => h('span',{class:'st',style:'--stc:'+stOf(c).c},stOf(c).l);
function setStatus(c, st, auto){
  if (!c || c.status===st) return;
  c.status = st; log('status', (auto?'Stato automatico: ':'')+c.name+' → '+STATUS[st].l, {clientId:c.id});
}

// Storico: eventi con i nomi "fotografati", così restano leggibili anche dopo un'eliminazione.
const HTYPES = {
  code:   { l:'Codici',    ic:'⌗', c:'#F07C3A' },
  pdf:    { l:'PDF',       ic:'⎙', c:'#2F7DC9' },
  edit:   { l:'Modifiche', ic:'✎', c:'#9B8EC4' },
  create: { l:'Creazioni', ic:'+', c:'#5A8A6A' },
  delete: { l:'Eliminazioni', ic:'✕', c:'#E8715A' },
  status: { l:'Etichette', ic:'●', c:'#C9A23F' },
  backup: { l:'Backup',    ic:'⇅', c:'#6B6560' },
};
function log(type, text, refs={}){
  state.history.unshift({ id:uid('h'), at:Date.now(), type, text, ...refs });
  if (state.history.length > 1500) state.history.length = 1500;
}

function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); return s && Array.isArray(s.workouts) ? s : null; }catch{ return null; } }
let saveT;
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch{}
  const el = $('#saved'); el.textContent = 'Salvato'; clearTimeout(saveT); saveT = setTimeout(()=>el.textContent='',1400);
}
function exName(id){ const e = CAT_BY_ID[id]; return e ? (e[state.lang] || e.it) : id; }
function mkEx(id, extra={}){ const e = CAT_BY_ID[id]; const dv = state && state.exerciseDefaults ? state.exerciseDefaults[id] : null; return { uid:uid('x'), exerciseId:id, emoji:e?.emoji||'💪', defaultSets:3, defaultReps:isHold(id)?'30s':'8-12', ...(dv?{videoUrl:dv}:{}), ...extra }; }
function seed(){
  // Scheda d'esempio, modificabile o eliminabile.
  const g = uid('grp');
  const w = { id:uid('w'), name:'Push A · Forza', emoji:'🏋️', type:'bodybuilding', client:'Cliente esempio', updatedAt:Date.now(), codes:[],
    exercises:[
      mkEx('bench_press',{defaultSets:4,defaultReps:'5',defaultKg:80,notes:'Fermo di 1" al petto sull\'ultima serie.'}),
      mkEx('incline_dumbbell_press',{defaultSets:3,defaultReps:'8-10'}),
      mkEx('lateral_raise',{defaultSets:3,defaultReps:'12-15',groupId:g}),
      mkEx('face_pull',{defaultSets:3,defaultReps:'15',groupId:g}),
    ],
    groups:[{id:g,type:'superset',rounds:3}] };
  // Cartella d'esempio: programma universale su più giorni, senza cliente.
  const f = { id:uid('f'), name:'Full Body · 2 giorni', emoji:'🗓️', createdAt:Date.now()-1000 };
  const d1 = { id:uid('w'), name:'Giorno 1 · Full Body A', emoji:'🔥', type:'hybrid', folderId:f.id, updatedAt:Date.now()-2000, codes:[], groups:[],
    exercises:[ mkEx('squat',{defaultSets:4,defaultReps:'6-8'}), mkEx('pull_up',{defaultSets:3,defaultReps:'6-10'}), mkEx('push_up',{defaultSets:3,defaultReps:'12-15'}) ] };
  const d2 = { id:uid('w'), name:'Giorno 2 · Full Body B', emoji:'⚡', type:'hybrid', folderId:f.id, updatedAt:Date.now()-3000, codes:[], groups:[],
    exercises:[ mkEx('deadlift',{defaultSets:3,defaultReps:'5'}), mkEx('overhead_press',{defaultSets:3,defaultReps:'8'}), mkEx('inverted_row',{defaultSets:3,defaultReps:'10-12'}) ] };
  return { lang:'it', currentId:null, workouts:[w,d1,d2], folders:[f] };
}
const cur = () => state.workouts.find(w => w.id === state.currentId);
function touch(){
  const w = cur();
  if (w){
    w.updatedAt = Date.now();
    // Le modifiche alla stessa scheda entro 30 minuti diventano una sola voce di storico.
    const last = state.history.find(x=>x.workoutId===w.id);
    if (last && Date.now()-last.at < 30*6e4 && (last.type==='edit' || last.type==='create')){ if (last.type==='edit'){ last.at=Date.now(); last.text='Modificata «'+(w.name||'Senza nome')+'»'; } }
    else log('edit','Modificata «'+(w.name||'Senza nome')+'»',{workoutId:w.id, clientId:w.clientId});
  }
  save();
}

// ── Video YouTube ──
// Accetta watch?v=, youtu.be, shorts, embed, live, m./music. e i parametri extra (si=, t=).
// I video "non in elenco" hanno lo stesso formato: basta il link, nessuna API.
function normalizeYouTube(raw){
  const s = String(raw||'').trim(); if (!s) return '';
  let u; try{ u = new URL(/^https?:\/\//i.test(s) ? s : 'https://'+s); }catch{ return null; }
  const host = u.hostname.replace(/^(www|m|music)\./,'');
  let id = null;
  if (host==='youtu.be') id = u.pathname.split('/')[1];
  else if (host==='youtube.com' || host==='youtube-nocookie.com'){
    if (u.pathname==='/watch') id = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([^/?#]+)/); if (m) id = m[2]; }
  }
  if (!id || !/^[A-Za-z0-9_-]{11}$/.test(id)) return null;
  const t = u.searchParams.get('t') || u.searchParams.get('start');
  return 'https://www.youtube.com/watch?v='+id+(t ? '&t='+encodeURIComponent(t.replace(/s$/,''))+'s' : '');
}

// ── Helpers DOM ──
const $ = s => document.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function toast(t){ const r = $('#toastRoot'); r.innerHTML=''; const el = h('div',{class:'toast'},t); r.append(el); setTimeout(()=>el.remove(),2000); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('Copiato'); }catch{ toast('Seleziona e copia manualmente'); } }
const fmtCode = c => c && c.length === 8 ? c.slice(0,4)+'-'+c.slice(4) : c;
const ago = ts => { const d = (Date.now()-ts)/6e4; if(d<1) return 'ora'; if(d<60) return Math.round(d)+' min fa'; if(d<1440) return Math.round(d/60)+' h fa'; return new Date(ts).toLocaleDateString('it-IT',{day:'numeric',month:'short'}); };

// ── Gruppi: membri sempre contigui, come in createGroup dell'app ──
function normalizeGroups(w){
  const ids = new Set(w.exercises.map(e=>e.groupId).filter(Boolean));
  w.groups = (w.groups||[]).filter(g => ids.has(g.id));
  const valid = new Set(w.groups.map(g=>g.id));
  w.exercises.forEach(e => { if (e.groupId && !valid.has(e.groupId)) delete e.groupId; });
  // superset con un solo membro → sciolto
  for (const g of [...w.groups]) {
    const n = w.exercises.filter(e=>e.groupId===g.id).length;
    if (g.type==='superset' && n<2) dissolve(w,g.id);
  }
  // compatta: porta i membri accanto al primo
  const out = []; const done = new Set();
  for (const e of w.exercises){
    if (!e.groupId){ out.push(e); continue; }
    if (done.has(e.groupId)) continue;
    done.add(e.groupId); out.push(...w.exercises.filter(x=>x.groupId===e.groupId));
  }
  w.exercises = out;
  // superset: serie di ogni membro = giri
  for (const g of w.groups) if (g.type==='superset') w.exercises.forEach(e=>{ if(e.groupId===g.id) e.defaultSets = g.rounds; });
}
function dissolve(w,gid){ w.groups = w.groups.filter(g=>g.id!==gid); w.exercises.forEach(e=>{ if(e.groupId===gid) delete e.groupId; }); }
function createGroup(type){
  const w = cur(); const picked = w.exercises.filter(e=>ui.selected.has(e.uid) && !e.groupId);
  if (type==='superset' && picked.length<2) return toast('Seleziona almeno 2 esercizi liberi');
  if (!picked.length) return toast('Seleziona almeno 1 esercizio libero');
  const gid = uid('grp');
  const firstIdx = w.exercises.indexOf(picked[0]);
  const rest = w.exercises.filter(e=>!picked.includes(e));
  const insertAt = w.exercises.slice(0,firstIdx).filter(e=>!picked.includes(e)).length;
  picked.forEach(e=>e.groupId=gid);
  w.exercises = [...rest.slice(0,insertAt), ...picked, ...rest.slice(insertAt)];
  w.groups.push(type==='superset'
    ? { id:gid, type, rounds: Math.max(...picked.map(e=>e.defaultSets||3)) }
    : { id:gid, type, emomIntervalSeconds:60, emomTotalIntervals:10, repsTarget:10 });
  ui.selected.clear(); normalizeGroups(w); touch(); render();
}

function buildPayload(w){

    _aethel: SHARE_FORMAT, kind:'workout', exportedAt:new Date().toISOString(),
    workout:{
      name: w.name.trim(), emoji: w.emoji, type: w.type,
      exercises: w.exercises.map(e => ({
        exerciseId: e.exerciseId, name: exName(e.exerciseId), emoji: e.emoji,
        defaultSets: Math.max(1, Math.round(+e.defaultSets||1)),
        defaultReps: String(e.defaultReps||'').trim() || '8-12',
        ...(+e.defaultKg > 0 && !isHold(e.exerciseId) ? { defaultKg: +e.defaultKg } : {}),
        ...(e.notes && e.notes.trim() ? { notes: e.notes.trim() } : {}),
        ...(e.videoUrl ? { videoUrl: e.videoUrl } : {}),
        ...(e.groupId ? { groupId: e.groupId } : {}),
      })),
      ...(w.groups.length ? { groups: w.groups.map(g => g.type==='superset'
          ? { id:g.id, type:g.type, rounds:g.rounds }
          : { id:g.id, type:g.type, emomIntervalSeconds:g.emomIntervalSeconds, emomTotalIntervals:g.emomTotalIntervals, ...(g.repsTarget>0?{repsTarget:g.repsTarget}:{}) }) } : {}),
    },
  };
}
async function createCode(payload){
  const res = await fetch(CONFIG.supabaseUrl + '/rest/v1/rpc/create_workout_code', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CONFIG.supabaseAnonKey, Authorization:'Bearer '+CONFIG.supabaseAnonKey },
    body: JSON.stringify({ p_payload:payload, p_ttl_days:CONFIG.codeTtlDays, p_reusable:true }),

}

function backupWarning(){
  const has = state.workouts.length || state.clients.length;
  const stale = !state.lastBackup || Date.now()-state.lastBackup > 7*864e5;
  if (!has || !stale) return null;
  return h('div',{class:'warn'},
    h('div',{}, h('b',{}, state.lastBackup ? 'Ultimo backup '+ago(state.lastBackup) : 'Nessun backup ancora'),
      h('p',{},'Clienti e schede sono salvati solo in questo browser. Se cancelli i dati di navigazione li perdi: scarica un backup ogni tanto.')),
    h('button',{class:'btn primary',onclick:exportBackup},'Esporta backup'));

function exportBackup(){
  state.lastBackup = Date.now(); log('backup','Backup esportato'); save();
  const data = JSON.stringify({ _aethelCoach:1, exportedAt:new Date().toISOString(), gym:CONFIG.gymName, state }, null, 2);
  const url = URL.createObjectURL(new Blob([data],{type:'application/json'}));
  const a = h('a',{href:url, download:'aethel-coach-backup-'+new Date().toISOString().slice(0,10)+'.json'});
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  render(); toast('Backup scaricato');
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result); const inc = d?.state;
      if (!d?._aethelCoach || !inc || !Array.isArray(inc.workouts)) throw new Error();
      // Unione per id: quello che c'è nel file aggiorna/aggiunge, niente viene cancellato.
      const merge = (key) => { const map = new Map((state[key]||[]).map(x=>[x.id,x])); (inc[key]||[]).forEach(x=>{ const old=map.get(x.id); if(!old || (x.updatedAt||0)>=(old.updatedAt||0)) map.set(x.id,x); }); state[key]=[...map.values()]; };
      merge('workouts'); merge('clients'); merge('folders'); merge('history');
      Object.assign(state.exerciseDefaults, inc.exerciseDefaults||{});
      state.history.sort((a,b)=>b.at-a.at); log('backup','Backup importato ('+inc.workouts.length+' schede)');
      state.lastBackup = Math.max(state.lastBackup||0, inc.lastBackup||0) || Date.now();
      save(); go('home');
      toast('Backup importato: '+inc.workouts.length+' schede, '+(inc.clients||[]).length+' clienti');
    }catch{ toast('File non valido: usa un backup esportato da Coach Studio'); }
  };
  r.readAsText(file);
}

// ── Storico ──
function dayLabel(ts){
  const d = new Date(ts); const t = new Date(); const y = new Date(Date.now()-864e5);
  if (d.toDateString()===t.toDateString()) return 'Oggi';
  if (d.toDateString()===y.toDateString()) return 'Ieri';
  return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:d.getFullYear()===t.getFullYear()?undefined:'numeric'});
}
function historyList(items){
  if (!items.length) return h('div',{class:'blank'},'Nessuna attività registrata.');
  const box = h('div',{class:'hist'}); let day = null;
  for (const x of items){
    const dl = dayLabel(x.at); if (dl!==day){ day=dl; box.append(h('div',{class:'hday'},dl)); }
    const t = HTYPES[x.type] || HTYPES.edit;
    const w = x.workoutId && state.workouts.find(w=>w.id===x.workoutId);
    const c = x.clientId && state.clients.find(c=>c.id===x.clientId);
    box.append(h('div',{class:'hrow'},
      h('time',{},new Date(x.at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})),
      h('span',{class:'hic',style:'--stc:'+t.c},t.ic),
      h('div',{class:'htx'}, h('b',{},x.text), (c||x.code) && h('span',{},[c?.name, x.code && Date.now()<=x.at+CONFIG.codeTtlDays*864e5 ? 'valido fino al '+new Date(x.at+CONFIG.codeTtlDays*864e5).toLocaleDateString('it-IT') : x.code ? 'scaduto' : null].filter(Boolean).join(' · '))),
      w ? h('button',{class:'btn sm ghost',onclick:()=>openWorkout(w.id)},'Apri scheda')
        : c && x.type!=='delete' ? h('button',{class:'btn sm ghost',onclick:()=>go('library',{libTab:'clients',libSel:{type:'client',id:c.id}})},'Apri cliente') : h('span',{})));
  }
  return box;
}
function renderHistory(root){
  const q = ui.libQ.trim().toLowerCase();
  const items = state.history.filter(x=>(ui.histType==='all'||x.type===ui.histType) && (!q || (x.text+' '+(state.clients.find(c=>c.id===x.clientId)?.name||'')).toLowerCase().includes(q)));
  root.append(h('div',{class:'page-in'},
    h('div',{class:'lib-top'}, h('h1',{},'Storico'),
      h('div',{class:'lib-tools'}, h('input',{class:'field',id:'histQ',placeholder:'Cerca nello storico…',value:ui.libQ,oninput:ev=>{ ui.libQ=ev.target.value; renderMain(); requestAnimationFrame(()=>{ const i=$('#histQ'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }); }}))),
    h('div',{class:'filters'},
      h('button',{class:'chip'+(ui.histType==='all'?' on':''),onclick:()=>{ ui.histType='all'; render(); }},'Tutto'),
      Object.entries(HTYPES).map(([k,v])=>state.history.some(x=>x.type===k) ? h('button',{class:'chip'+(ui.histType===k?' on':''),onclick:()=>{ ui.histType=k; render(); }},v.l) : null)),
    historyList(items.slice(0,300)),
    items.length>300 ? h('p',{style:'color:var(--t3);font-size:12px;margin:0'},'Mostrate le 300 attività più recenti su '+items.length+'. Usa la ricerca per trovare le altre.') : null));
}

// ── PDF cliente ──
// jsPDF + autotable sono in vendor/ e si caricano solo al primo export.
function loadScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector('script[src="'+src+'"]')) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('Impossibile caricare '+src)); document.head.append(s); }); }
function imgData(src, bg){
  return new Promise(ok=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); if(bg){ x.fillStyle=bg; x.fillRect(0,0,c.width,c.height); } x.drawImage(im,0,0);
    try{ ok({data:c.toDataURL('image/jpeg',.85), w:im.naturalWidth, h:im.naturalHeight}); }catch{ ok(null); } }; im.onerror=()=>ok(null); im.src=src; });
}
// Helvetica standard copre solo Latin-1: via emoji e simboli fuori set.
const T = s => String(s??'').replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/→/g,'->').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,'').replace(/[ \t]+/g,' ').trim();
async function exportClientPdf(client, btn){
  const ws = wsOf('client',client.id).filter(w=>w.exercises.length).sort((a,b)=>(a.name||'').localeCompare(b.name||'','it',{numeric:true}));
  if (!ws.length) return toast('Nessuna scheda con esercizi');
  const label = btn?.textContent; if (btn){ btn.disabled=true; btn.textContent='Preparo il PDF…'; }
  try{
    await loadScript('vendor/jspdf.umd.min.js'); await loadScript('vendor/jspdf.plugin.autotable.min.js');
    const { jsPDF } = window.jspdf;
    const [cali, aeth] = await Promise.all([imgData('caligram-logo.png','#000'), imgData('aethel-logo.png','#fff')]);
    const ids = [...new Set(ws.flatMap(w=>w.exercises.map(e=>e.exerciseId)))].filter(id=>CAT_BY_ID[id]?.img);
    const thumbs = Object.fromEntries(await Promise.all(ids.map(async id=>[id, await imgData('img/'+id+'.webp','#fff')])));

    const doc = new jsPDF({unit:'mm', format:'a4'}); const W = 210, M = 14;
    const INK=[26,23,20], T2=[107,101,96], T3=[168,162,156], ACC=[240,124,58], ACCL=[254,240,231], LIL=[155,142,196], LILL=[240,237,249], SAGE=[90,138,106], SAGEL=[235,243,238], CREAM=[250,248,244];
    const today = new Date().toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});

    // Copertina: banda nera con i due loghi
    doc.setFillColor(0,0,0); doc.rect(0,0,W,36,'F');
    if (cali) doc.addImage(cali.data,'JPEG',M,8,20*cali.w/cali.h,20);
    const xX = M + (cali ? 20*cali.w/cali.h : 50) + 6;
    doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(16); doc.text('x', xX, 21);
    if (aeth) doc.addImage(aeth.data,'JPEG',xX+7,10,16,16);
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('Aethel', xX+26, 20.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...T3); doc.text('WORKOUT TRACKER', xX+26, 25);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(T(client.name), W-M, 17, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...T3);
    doc.text([client.code?.trim() ? 'Codice cliente '+T(client.code) : null, today].filter(Boolean), W-M, 23, {align:'right'});

    doc.setTextColor(...INK); doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.text('Programma di allenamento', M, 52);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...T2);
    doc.text(T(CONFIG.gymName)+'  ·  '+ws.length+(ws.length===1?' scheda':' schede')+'  ·  '+ws.reduce((n,w)=>n+w.exercises.length,0)+' esercizi', M, 59);
    let y = 70;
    const bundle = (client.codes||[]).find(c=>Date.now()<=expiresAt(c));
    if (bundle){
      doc.setFillColor(...ACC); doc.roundedRect(M, 64, W-2*M, 13, 3, 3, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('Importa tutte le schede in Aethel con un solo codice', M+5, 72);
      doc.setFontSize(13); doc.text(fmtCode(bundle.code), W-M-5, 72.5, {align:'right'});
      y = 86;
    }

    const typeL = Object.fromEntries(TYPES);
    for (const w of ws){
      if (y > 235){ doc.addPage(); y = 22; }
      const code = (w.codes||[]).find(c=>Date.now()<=expiresAt(c));
      doc.setFillColor(...ACCL); doc.roundedRect(M, y, W-2*M, 15, 3, 3, 'F');
      doc.setTextColor(...INK); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(T(w.name)||'Scheda', M+5, y+6.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...T2);
      doc.text([typeL[w.type], w.exercises.length+' esercizi', folderName(w)?T(folderName(w)):null].filter(Boolean).join('  ·  '), M+5, y+11.5);
      if (code){ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ACC); doc.text('Codice Aethel  '+fmtCode(code.code), W-M-5, y+9.2, {align:'right'}); }
      y += 18;

      const body = []; const seen = new Set();
      w.exercises.forEach(e=>{
        const g = e.groupId && w.groups.find(g=>g.id===e.groupId);
        if (g && !seen.has(g.id)){
          seen.add(g.id);
          const members = w.exercises.filter(x=>x.groupId===g.id).length;
          const txt = g.type==='superset'
            ? (members>2?'GIANT SET':'SUPERSET')+'  ·  '+g.rounds+' giri, senza pausa tra gli esercizi'
            : 'EMOM  ·  ogni '+g.emomIntervalSeconds+'s per '+g.emomTotalIntervals+' intervalli'+(g.repsTarget?'  ·  '+g.repsTarget+' reps':'');
          const sup = g.type==='superset';
          body.push([{content:txt, colSpan:7, styles:{fillColor:sup?LILL:SAGEL, textColor:sup?LIL:SAGE, fontStyle:'bold', fontSize:8, cellPadding:{top:2,bottom:2,left:4,right:4}}}]);
        }
        const letter = g ? String.fromCharCode(65+[...seen].indexOf(g.id))+(w.exercises.filter(x=>x.groupId===g.id).indexOf(e)+1)+'  ' : '';
        const cat = CAT_BY_ID[e.exerciseId]; const hold = isHold(e.exerciseId);
        body.push([
          {content:'', id:e.exerciseId},
          T(letter+exName(e.exerciseId))+'\n'+T((cat?.m||[]).map(m=>MUSCLES[state.lang][m]).join(', ')),
          g?.type==='emom' ? '-' : String(e.defaultSets),
          hold ? holdSecs(e.defaultReps)+' sec' : T(e.defaultReps),
          !hold && +e.defaultKg>0 ? String(e.defaultKg) : '-',
          T(e.notes||''),
          e.videoUrl ? {content:'Guarda il\ntutorial', url:e.videoUrl, styles:{textColor:ACC, fontStyle:'bold', halign:'center', fontSize:8}} : {content:'-', styles:{halign:'center', textColor:T3}},
        ]);
      });
      doc.autoTable({
        startY:y, margin:{left:M,right:M,top:20,bottom:18}, body,
        head:[['','Esercizio','Serie','Reps','Kg','Note','Video']],
        theme:'plain',
        styles:{font:'helvetica', fontSize:9, textColor:INK, cellPadding:{top:2.4,bottom:2.4,left:2.5,right:2.5}, valign:'middle', lineColor:[232,228,222], lineWidth:{bottom:.2}},
        headStyles:{fillColor:INK, textColor:[255,255,255], fontStyle:'bold', fontSize:8},
        columnStyles:{0:{cellWidth:24, minCellHeight:15}, 1:{cellWidth:50, fontStyle:'bold'}, 2:{cellWidth:13, halign:'center'}, 3:{cellWidth:17, halign:'center'}, 4:{cellWidth:13, halign:'center'}, 5:{textColor:T2, fontSize:8.5}, 6:{cellWidth:20}},
        didParseCell:d=>{ if(d.section==='body' && d.column.index===1 && typeof d.cell.raw==='string'){ d.cell.styles.fontStyle='bold'; } },
        didDrawCell:d=>{
          // Link cliccabile sull'intera cella "Guarda il tutorial": l'URL non viene stampato.
          if (d.section==='body' && d.column.index===6 && d.cell.raw?.url){ doc.link(d.cell.x, d.cell.y, d.cell.width, d.cell.height, {url:d.cell.raw.url}); return; }
          if (d.section!=='body' || d.column.index!==0) return;
          const t = thumbs[d.cell.raw?.id]; if (!t) return;
          const ih = Math.min(d.cell.height-3, 13), iw = ih*t.w/t.h;
          doc.addImage(t.data,'JPEG', d.cell.x+(d.cell.width-iw)/2, d.cell.y+(d.cell.height-ih)/2, iw, ih);
        },
      });
      y = doc.lastAutoTable.finalY + 12;
    }

    // Pagine successive: intestazione sottile + piè di pagina su tutte
    const n = doc.getNumberOfPages();
    for (let i=1;i<=n;i++){
      doc.setPage(i);
      if (i>1){
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...T2);
        doc.text(T(CONFIG.gymName)+' x Aethel', M, 11); doc.text(T(client.name), W-M, 11, {align:'right'});
        doc.setDrawColor(232,228,222); doc.setLineWidth(.3); doc.line(M,13.5,W-M,13.5);
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...T3);
      doc.text('Importa le schede nell\'app Aethel: Allenamenti -> Importa scheda -> Da codice', M, 289);
      doc.text('Pagina '+i+' di '+n, W-M, 289, {align:'right'});
    }
    const fname = 'Scheda_'+T(client.name).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+new Date().toISOString().slice(0,10)+'.pdf';
    doc.save(fname);
    log('pdf','PDF esportato: '+ws.length+(ws.length===1?' scheda':' schede'),{clientId:client.id}); save();
    toast('PDF scaricato');
  }catch(err){ toast('PDF non creato: '+(err.message||err)); }
  finally{ if (btn){ btn.disabled=false; btn.textContent=label; } render(); }
}

// ── Codice unico per tutte le schede del cliente ──
// Payload kind:'bundle' → l'app (dalla versione che lo supporta) importa tutte
// le schede in una nuova cartella. Le versioni precedenti rispondono "codice non valido".
function buildBundlePayload(ws){
  return { _aethel:SHARE_FORMAT, kind:'bundle', exportedAt:new Date().toISOString(),
    name:'Programma '+CONFIG.gymName, emoji:'🏋️', workouts: ws.map(w=>buildPayload(w).workout) };
}
async function openClientBundleCode(client){
  const ws = wsOf('client',client.id).filter(w=>w.exercises.length && w.name.trim()).sort((a,b)=>a.name.localeCompare(b.name,'it',{numeric:true}));
  const root=$('#modalRoot'); const close=()=>root.replaceChildren();
  const body = h('div',{class:'modal',role:'dialog','aria-modal':'true'}, h('h3',{},'Codice unico'), h('div',{class:'spinner'}), h('p',{},'Preparo un codice con '+ws.length+' schede…'));
  root.replaceChildren(h('div',{class:'scrim',onclick:ev=>{ if(ev.target===ev.currentTarget) close(); }}, body));
  try{
    const code = await createCode(buildBundlePayload(ws));
    client.codes = [{code, at:Date.now(), count:ws.length}, ...(client.codes||[])].slice(0,5);
    log('code','Codice unico '+fmtCode(code)+' · '+ws.length+' schede per '+client.name,{clientId:client.id, code});
    setStatus(client,'sent',true); save(); render();
    const msg = `Ciao ${client.name.split(' ')[0]}! Ecco il tuo programma da ${CONFIG.gymName}: ${ws.length} schede in un solo codice.\nApri Aethel → Allenamenti → Importa scheda → Da codice e inserisci:\n${fmtCode(code)}\n(valido ${CONFIG.codeTtlDays} giorni, serve l'ultima versione di Aethel)`;
    body.replaceChildren(h('h3',{},client.name),
      h('p',{},'Con questo codice il cliente importa tutte le schede in una volta, raccolte in una cartella.'),
      h('div',{class:'big-code'},fmtCode(code)),
      h('div',{class:'multi'}, ws.map(w=>h('div',{}, h('span',{},w.emoji+' '+w.name), h('span',{style:'color:var(--t3)'},w.exercises.length+' esercizi')))),
      h('div',{class:'msg-box'},msg),
      h('div',{class:'row'}, h('button',{class:'btn',onclick:()=>copy(fmtCode(code))},'Copia codice'), h('button',{class:'btn primary',onclick:()=>copy(msg)},'Copia messaggio'), h('button',{class:'btn ghost',onclick:close},'Chiudi')));
  }catch(err){
    body.replaceChildren(h('h3',{},'Codice non generato'), h('p',{class:'err'},err.message||String(err)),
      h('div',{class:'row'}, h('button',{class:'btn primary',onclick:()=>openClientBundleCode(client)},'Riprova'), h('button',{class:'btn ghost',onclick:close},'Chiudi')));
  }
}

// Codici per tutti i giorni di una cartella (una chiamata per scheda)
async function openFolderCodes(f){
  const ws = wsOf('folder',f.id).filter(w=>w.exercises.length && w.name.trim()).sort((a,b)=>a.name.localeCompare(b.name,'it',{numeric:true}));
  const root=$('#modalRoot'); const close=()=>root.replaceChildren();
  const body = h('div',{class:'modal',role:'dialog','aria-modal':'true'}, h('h3',{},(f.emoji||'📁')+' '+f.name), h('div',{class:'spinner'}), h('p',{},'Genero '+ws.length+' codici…'));
  root.replaceChildren(h('div',{class:'scrim',onclick:ev=>{ if(ev.target===ev.currentTarget) close(); }}, body));
  const res = [];
  for (const w of ws){
    try{ const code = await createCode(buildPayload(w)); w.codes=[{code,at:Date.now()},...(w.codes||[])].slice(0,5); w.updatedAt=Date.now(); res.push({w,code});
      log('code','Codice '+fmtCode(code)+' per «'+w.name.trim()+'»',{workoutId:w.id, clientId:w.clientId, code}); setStatus(clientOf(w),'sent',true); }
    catch(err){ res.push({w,err:err.message||String(err)}); }

  const okRes = res.filter(r=>r.code);

  body.replaceChildren(h('h3',{},(f.emoji||'📁')+' '+f.name),
    h('p',{}, okRes.length+' di '+res.length+' codici generati. Il cliente importa una scheda per codice.'),
    h('div',{class:'multi'}, res.map(r=>h('div',{}, h('span',{},r.w.emoji+' '+r.w.name), r.code?h('span',{class:'cc'},fmtCode(r.code)):h('span',{class:'err'},r.err)))),
    okRes.length ? h('div',{class:'msg-box'},msg) : null,
    h('div',{class:'row'}, !okRes.length ? null : h('button',{class:'btn primary',onclick:()=>copy(msg)},'Copia messaggio'), h('button',{class:'btn ghost',onclick:close},'Chiudi')));

function paramField(label, value, onChange, opts={}){
  const inp = h('input',{value, class:opts.wide?'wide':'', inputmode:opts.num?'numeric':'text', 'aria-label':label, disabled:opts.locked,
    oninput:e=>onChange(e.target.value), onchange:()=>render()});
  const kids = [h('label',{},label)];
  if (opts.num && !opts.locked) kids.push(h('button',{class:'step',onclick:()=>{onChange(String(Math.max(opts.min??0,(+inp.value||0)-(opts.step||1)))); render();}},'−'));
  kids.push(inp);
  if (opts.num && !opts.locked) kids.push(h('button',{class:'step',onclick:()=>{onChange(String(Math.min(opts.max??999,(+inp.value||0)+(opts.step||1)))); render();}},'+'));
  return h('div',{class:'pf'+(opts.locked?' locked':''), title:opts.title||''}, ...kids);
}
function exCard(w, e, memberLabel, group){
  const cat = CAT_BY_ID[e.exerciseId]; const i = w.exercises.indexOf(e);
  const notes = h('textarea',{class:'notes', rows:1, placeholder:'Nota per il cliente (tecnica, tempo, recupero…)', value:e.notes||'',
    oninput:ev=>{ e.notes = ev.target.value; autoGrow(ev.target); touch(); }});
  requestAnimationFrame(()=>autoGrow(notes));
  const vidOk = !!e.videoUrl;
  const vid = h('div',{class:'vid'+(vidOk?' ok':'')},
    h('span',{class:'yt','aria-hidden':'true'},'▶'),
    h('input',{value:e.videoRaw ?? e.videoUrl ?? '', placeholder:'Link video tutorial YouTube (facoltativo)', 'aria-label':'Link video tutorial',
      onchange:ev=>{ const v = ev.target.value.trim(); const n = normalizeYouTube(v);
        if (!v){ delete e.videoUrl; delete e.videoRaw; }
        else if (n){ e.videoUrl = n; delete e.videoRaw; }
        else { delete e.videoUrl; e.videoRaw = v; }
        touch(); render(); }}),
    e.videoRaw ? h('span',{class:'bad'},'Link YouTube non valido')
      : vidOk ? h('a',{href:e.videoUrl, target:'_blank', rel:'noopener'},'Apri ↗') : null);
  const card = h('div',{class:'ex'+(ui.selected.has(e.uid)?' sel':''), draggable:'true', 'data-uid':e.uid},
    h('div',{class:'grip'},
      h('span',{class:'handle',title:'Trascina per riordinare'},'⋮⋮'),
      !e.groupId && h('input',{type:'checkbox', checked:ui.selected.has(e.uid), title:'Seleziona per superset/EMOM',
        onchange:ev=>{ ev.target.checked?ui.selected.add(e.uid):ui.selected.delete(e.uid); render(); }})),
    cat?.img ? h('img',{class:'thumb', src:'img/'+e.exerciseId+'.webp', alt:'', loading:'lazy'}) : h('div',{class:'thumb'}),
    h('div',{class:'ex-body'},
      h('div',{class:'ex-name'}, memberLabel && h('span',{class:'member-tag'},memberLabel), exName(e.exerciseId), isHold(e.exerciseId) && h('span',{class:'hold-tag'},'Tenuta'),
        h('span',{class:'mus'}, (cat?.m||[]).map(m=>MUSCLES[state.lang][m]||m).join(' · '))),
      h('div',{class:'params'},
        group?.type==='superset'
          ? paramField('Serie', e.defaultSets, ()=>{}, {locked:true, title:'Nei superset le serie seguono i giri del blocco'})
          : group?.type==='emom' ? null
          : paramField('Serie', e.defaultSets, v=>{ e.defaultSets = Math.max(1, Math.min(20, parseInt(v)||1)); touch(); }, {num:true,min:1,max:20}),
        isHold(e.exerciseId)
          ? paramField('Secondi', holdSecs(e.defaultReps), v=>{ e.defaultReps = Math.max(1, Math.min(600, parseInt(v)||1))+'s'; touch(); }, {num:true,step:5,min:5,max:600})
          : paramField(group?.type==='emom'?'Reps / sec':'Reps', e.defaultReps, v=>{ e.defaultReps = v.slice(0,40); touch(); }, {wide:true}),
        isHold(e.exerciseId) ? null
          : paramField('Kg', e.defaultKg ?? '', v=>{ const n = parseFloat(String(v).replace(',','.')); e.defaultKg = n>0 ? Math.round(n*4)/4 : undefined; touch(); }, {num:true,step:2.5,min:0})),
      notes, vid),
    h('div',{class:'ex-actions'},
      h('button',{class:'icon-btn',title:'Su',onclick:()=>move(w,i,-1)},'↑'),
      h('button',{class:'icon-btn',title:'Giù',onclick:()=>move(w,i,1)},'↓'),
      h('button',{class:'icon-btn',title:'Rimuovi',onclick:()=>{ w.exercises.splice(i,1); ui.selected.delete(e.uid); normalizeGroups(w); touch(); render(); }},'✕')));
  // drag & drop
  card.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/plain',e.uid); card.classList.add('dragging'); });
  card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  card.addEventListener('dragover',ev=>{ ev.preventDefault(); card.classList.add('drag-over'); });
  card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
  card.addEventListener('drop',ev=>{
    ev.preventDefault(); card.classList.remove('drag-over');
    const from = w.exercises.findIndex(x=>x.uid===ev.dataTransfer.getData('text/plain'));
    const to = w.exercises.indexOf(e);
    if (from<0 || from===to) return;
    const [m] = w.exercises.splice(from,1);
    // entra nel blocco di destinazione (o ne esce) in base a dove viene lasciato
    if (e.groupId) m.groupId = e.groupId; else delete m.groupId;
    w.exercises.splice(to,0,m); normalizeGroups(w); touch(); render();
  });
  return card;
}
function move(w,i,d){
  const j = i+d; if (j<0||j>=w.exercises.length) return;
  const a = w.exercises[i], b = w.exercises[j];
  if (a.groupId !== b.groupId) return toast('Trascina l\'esercizio per spostarlo dentro o fuori da un blocco');
  [w.exercises[i],w.exercises[j]] = [b,a]; touch(); render();
}
function autoGrow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }

function renderEditor(){
  const w = cur(); const root = $('#editor'); root.replaceChildren();
  if (!w){ root.append(h('div',{class:'empty'},h('h3',{},'Nessuna scheda'),h('p',{},'Crea la prima scheda con “+ Nuova”.'))); return; }
  const totalSets = w.exercises.reduce((s,e)=>{ const g = w.groups.find(g=>g.id===e.groupId); return s + (g?.type==='emom' ? 0 : (+e.defaultSets||0)); },0);
  const emomMin = w.groups.filter(g=>g.type==='emom').reduce((s,g)=>s+g.emomIntervalSeconds*g.emomTotalIntervals/60,0);

  const emojiBtn = h('button',{class:'emoji-pick', title:'Cambia icona', onclick:()=>{ ui.emojiOpen=!ui.emojiOpen; render(); }}, w.emoji,
    ui.emojiOpen && h('div',{class:'emoji-pop', onclick:ev=>ev.stopPropagation()}, EMOJIS.map(em=>h('button',{onclick:()=>{ w.emoji=em; ui.emojiOpen=false; touch(); render(); }},em))));
  const typeSeg = h('div',{class:'seg'}, TYPES.map(([v,l])=>h('button',{class:w.type===v?'on':'', onclick:()=>{ w.type=v; touch(); render(); }},l)));
  root.append(h('div',{class:'head'}, emojiBtn,
    h('div',{class:'head-fields'},
      h('input',{class:'title-in', id:'titleIn', value:w.name, placeholder:'Nome della scheda', maxlength:120, oninput:e=>{ w.name=e.target.value; touch(); renderSide(); renderTop(); }}),
      h('div',{class:'row'},
        h('select',{class:'field client-sel', id:'clientSel', title:'Cliente (solo per te, non viene inviato)', onchange:e=>{
            const v = e.target.value;
            if (v==='__new'){ e.target.value = w.clientId||''; return promptEntity('client', c=>{ w.clientId=c.id; touch(); render(); }); }
            if (v) w.clientId = v; else delete w.clientId; touch(); render(); }},
          h('option',{value:''},'Nessun cliente (universale)'),
          [...state.clients].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(c=>{ const o=h('option',{value:c.id},c.name); if(c.id===w.clientId) o.selected=true; return o; }),
          h('option',{value:'__new'},'+ Nuovo cliente…')),
        h('select',{class:'field client-sel', id:'folderSel', title:'Cartella', onchange:e=>{
            const v = e.target.value;
            if (v==='__new'){ e.target.value = w.folderId||''; return promptEntity('folder', f=>{ w.folderId=f.id; touch(); render(); }); }
            if (v) w.folderId = v; else delete w.folderId; touch(); render(); }},
          h('option',{value:''},'Nessuna cartella'),
          [...state.folders].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(f=>{ const o=h('option',{value:f.id},(f.emoji||'📁')+' '+f.name); if(f.id===w.folderId) o.selected=true; return o; }),
          h('option',{value:'__new'},'+ Nuova cartella…')),
        typeSeg),
      h('div',{class:'stats'},
        h('span',{},h('b',{},w.exercises.length),' esercizi'),
        h('span',{},h('b',{},totalSets),' serie'),
        emomMin>0 && h('span',{},h('b',{},Math.round(emomMin)),' min di EMOM'),
        w.groups.length>0 && h('span',{},h('b',{},w.groups.length),' blocchi')))));

  const cl = clientOf(w);
  if (cl?.note?.trim()) root.append(h('div',{class:'note-banner'}, h('div',{}, h('b',{},'Note su '+cl.name), cl.note.trim())));
  if (ui.selected.size){
    root.append(h('div',{class:'selbar'}, h('span',{},ui.selected.size+' selezionati'),
      h('button',{class:'btn sm primary',onclick:()=>createGroup('superset')},'Crea superset'),
      h('button',{class:'btn sm',onclick:()=>createGroup('emom')},'Crea EMOM'),
      h('button',{class:'btn sm',onclick:()=>{ ui.selected.clear(); render(); }},'Annulla')));
  }

  const list = h('div',{class:'list'});
  if (!w.exercises.length) list.append(h('div',{class:'empty'},h('h3',{},'Aggiungi il primo esercizio'),h('p',{},'Sceglilo dal catalogo a destra: un clic e entra nella scheda.')));
  const seen = new Set();
  for (const e of w.exercises){
    if (!e.groupId){ list.append(exCard(w,e)); continue; }
    if (seen.has(e.groupId)) continue; seen.add(e.groupId);
    const g = w.groups.find(x=>x.id===e.groupId); const members = w.exercises.filter(x=>x.groupId===g.id);
    const letter = String.fromCharCode(65 + [...seen].length - 1);
    const head = g.type==='superset'
      ? [h('span',{class:'badge'}, members.length>2?'Giant set':'Superset'),
         paramField('Giri', g.rounds, v=>{ g.rounds=Math.max(1,Math.min(20,parseInt(v)||1)); normalizeGroups(w); touch(); }, {num:true,min:1,max:20})]
      : [h('span',{class:'badge'}, g.emomIntervalSeconds===60?'EMOM':'E'+(g.emomIntervalSeconds%60===0?g.emomIntervalSeconds/60+'MOM':g.emomIntervalSeconds+'s')),
         paramField('Ogni sec', g.emomIntervalSeconds, v=>{ g.emomIntervalSeconds=Math.max(15,Math.min(600,parseInt(v)||60)); touch(); }, {num:true,step:15,min:15,max:600}),
         paramField('Intervalli', g.emomTotalIntervals, v=>{ g.emomTotalIntervals=Math.max(1,Math.min(60,parseInt(v)||1)); touch(); }, {num:true,min:1,max:60}),
         paramField('Reps', g.repsTarget??'', v=>{ const n=parseInt(v); g.repsTarget = n>0?n:undefined; touch(); }, {num:true,min:0})];
    list.append(h('div',{class:'group '+g.type},
      h('div',{class:'group-h'}, ...head, h('span',{class:'sp'}), h('button',{class:'btn sm ghost',onclick:()=>{ dissolve(w,g.id); touch(); render(); }},'Sciogli blocco')),
      members.map((m,k)=>exCard(w,m,letter+(k+1),g))));
  }
  root.append(list);
}

function renderTop(){
  const w = cur();
  $('#crumbs').textContent = w ? [clientName(w)||folderName(w)||'Universale', w.name||'Senza nome'].filter(Boolean).join('  /  ') : '';
  const last = w?.codes?.[0];
  const chip = $('#lastCode');
  if (last){ chip.hidden=false; chip.textContent = fmtCode(last.code); chip.title = 'Ultimo codice · '+new Date(last.at).toLocaleDateString('it-IT'); }
  else chip.hidden = true;
  $('#dockHint').textContent = w && w.exercises.length ? 'Il cliente inserisce il codice in Aethel → Allenamenti → Importa scheda → Da codice.' : 'Aggiungi almeno un esercizio per generare il codice.';
  $('#codeBtn').disabled = !w || !w.exercises.length || !w.name.trim();
}

// ── Render: catalogo ──
function renderCatalogue(){
  const chips = $('#muscleChips'); chips.replaceChildren(
    ...MUSCLE_ORDER.map(m=>h('button',{class:'chip'+(ui.muscle===m?' on':''), onclick:()=>{ ui.muscle = ui.muscle===m?null:m; renderCatalogue(); }}, MUSCLES[state.lang][m])));
  document.querySelectorAll('#catSeg button').forEach(b=>b.classList.toggle('on', b.dataset.c===ui.catFilter));
  const q = ui.q.trim().toLowerCase();
  const w = cur(); const counts = {}; (w?.exercises||[]).forEach(e=>counts[e.exerciseId]=(counts[e.exerciseId]||0)+1);
  const items = CAT.filter(e => (ui.catFilter==='all'||e.cat===ui.catFilter) && (!ui.muscle||e.m.includes(ui.muscle)) && (!q || (e.it+' '+e.en+' '+e.id).toLowerCase().includes(q)));
  $('#catCount').textContent = items.length + ' / ' + CAT.length;
  const list = $('#catList'); list.replaceChildren();
  if (!items.length) list.append(h('div',{class:'lib-empty',style:'grid-column:1/-1'},'Nessun esercizio corrisponde ai filtri.'));
  items.forEach(e => list.append(h('button',{class:'card', title:'Aggiungi alla scheda', onclick:()=>addExercise(e.id)},
    e.img ? h('img',{src:'img/'+e.id+'.webp', alt:'', loading:'lazy'}) : h('img',{alt:''}),
    counts[e.id] && h('span',{class:'count'},'×'+counts[e.id]),
    h('span',{class:'plus'},'+'),
    h('div',{class:'ci'}, h('div',{class:'cn'}, e[state.lang]), h('div',{class:'cm'}, e.m.map(m=>MUSCLES[state.lang][m]).join(' · ')),
      h('button',{class:'cvid'+(state.exerciseDefaults[e.id]?' on':''), onclick:ev=>{ ev.stopPropagation(); setDefaultVideo(e.id, e[state.lang]); }}, state.exerciseDefaults[e.id]?'▶ Video impostato':'▶ Imposta video')))));
}
function addExercise(id){
  const w = cur(); if (!w) return;
  w.exercises.push(mkEx(id, isHold(id) ? {} : CAT_BY_ID[id]?.cat==='calisthenics' ? {defaultReps:'6-10'} : {}));
  touch(); render();
  requestAnimationFrame(()=>{ const ed = document.querySelector('.editor'); ed.scrollTo({top:ed.scrollHeight,behavior:'smooth'}); });
}

function setDefaultVideo(id, label){
  const cur = state.exerciseDefaults[id] || '';
  const root=$('#modalRoot'); const close=()=>root.replaceChildren();
  const inp = h('input',{class:'field',id:'defVidIn',value:cur,placeholder:'Link YouTube del tutorial'});
  const err = h('p',{class:'err',hidden:true});
  const commit = ()=>{
    const v = inp.value.trim();
    if (!v){ delete state.exerciseDefaults[id]; persistAndClose(); return; }
    const n = normalizeYouTube(v);
    if (!n){ err.hidden=false; err.textContent='Link YouTube non valido'; return; }
    state.exerciseDefaults[id] = n; persistAndClose();
  };
  const persistAndClose = ()=>{ save(); close(); renderCatalogue(); toast('Video di default aggiornato'); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); });
  root.replaceChildren(h('div',{class:'scrim',onclick:ev=>{ if(ev.target===ev.currentTarget) close(); }},
    h('div',{class:'modal',role:'dialog','aria-modal':'true'},
      h('h3',{},label),
      h('p',{},'Ogni volta che aggiungi questo esercizio a una scheda, il link viene precompilato. Modificabile per singolo esercizio nella scheda.'),
      inp, err,
      h('div',{class:'row'}, cur && h('button',{class:'btn ghost danger',onclick:()=>{ delete state.exerciseDefaults[id]; persistAndClose(); }},'Rimuovi'), h('button',{class:'btn primary',onclick:commit},'Salva')))));
  requestAnimationFrame(()=>inp.focus());
}

// ── Modale codice ──
function openCodeModal(){
  const w = cur(); if (!w) return;
  const root = $('#modalRoot');
  const close = ()=>root.replaceChildren();
  const body = h('div',{class:'modal',role:'dialog','aria-modal':'true'}, h('h3',{},'Codice per il cliente'), h('div',{class:'spinner'}), h('p',{},'Sto generando il codice…'));
  root.replaceChildren(h('div',{class:'scrim',onclick:ev=>{ if(ev.target===ev.currentTarget) close(); }}, body));
  createCode(buildPayload(w)).then(code=>{
    w.codes = [{code, at:Date.now()}, ...(w.codes||[])].slice(0,5);
    log('code','Codice '+fmtCode(code)+' per «'+w.name.trim()+'»'+(clientName(w)?' · '+clientName(w):''),{workoutId:w.id, clientId:w.clientId, code});
    setStatus(clientOf(w),'sent',true); w.updatedAt=Date.now(); save(); renderSide(); renderTop();
    const msg = `Ciao${clientName(w)?' '+clientName(w).split(' ')[0]:''}! Ecco la tua scheda “${w.name.trim()}” da ${CONFIG.gymName}.\nApri Aethel → Allenamenti → Importa scheda → Da codice e inserisci:\n${fmtCode(code)}\n(valido ${CONFIG.codeTtlDays} giorni)`;
    body.replaceChildren(
      h('h3',{},w.emoji+' '+w.name.trim()),
      h('p',{},'Il cliente lo inserisce in Aethel per importare la scheda. Valido '+CONFIG.codeTtlDays+' giorni, riutilizzabile.'),
      h('div',{class:'big-code'},fmtCode(code)),
      h('div',{class:'msg-box'},msg),
      h('div',{class:'row'},
        h('button',{class:'btn',onclick:()=>copy(fmtCode(code))},'Copia codice'),
        h('button',{class:'btn primary',onclick:()=>copy(msg)},'Copia messaggio'),
        h('button',{class:'btn ghost',onclick:close},'Chiudi')));
  }).catch(err=>{
    body.replaceChildren(h('h3',{},'Codice non generato'),
      h('p',{class:'err'},err.message||String(err)),
      h('p',{},'Controlla la connessione e riprova. La scheda resta salvata.'),
      h('div',{class:'row'}, h('button',{class:'btn primary',onclick:openCodeModal},'Riprova'), h('button',{class:'btn ghost',onclick:close},'Chiudi')));
  });
}
let delArmed = null;

function renderMain(){
  const page = $('#pageView'); const ed = ui.view==='editor' && cur();
  if (ui.view==='editor' && !cur()) ui.view='home';
  $('#app').classList.toggle('no-cat', !ed);
  page.hidden = !!ed; $('#editorView').hidden = !ed;
  if (ed){ renderEditor(); renderTop(); renderCatalogue(); }
  else { const sc = page.scrollTop; page.replaceChildren(); ui.view==='library' ? renderLibrary(page) : ui.view==='history' ? renderHistory(page) : renderHome(page); page.scrollTop = sc; }
}
function render(){ renderSide(); renderMain();
  $('#backupInfo').textContent = state.lastBackup ? 'Ultimo backup '+ago(state.lastBackup) : 'Salvate solo in questo browser'; }

// ── Eventi globali ──
$('#newBtn').onclick = ()=>newWorkout();
$('#exportBtn').onclick = exportBackup;
$('#importBtn').onclick = ()=>$('#importFile').click();
$('#importFile').onchange = e=>{ const f=e.target.files?.[0]; if(f) importBackup(f); e.target.value=''; };
// Chiede al browser di non cancellare questi dati in automatico quando lo spazio scarseggia.
try{ navigator.storage?.persist?.(); }catch{}
$('#backBtn').onclick = ()=>go(ui.prevView||'home');
$('#dupBtn').onclick = ()=>{ const w = cur(); if(!w) return; const c = JSON.parse(JSON.stringify(w));
  const map = {}; c.groups.forEach(g=>{ map[g.id]=uid('grp'); g.id=map[g.id]; }); c.exercises.forEach(e=>{ e.uid=uid('x'); if(e.groupId) e.groupId=map[e.groupId]; });
  Object.assign(c,{id:uid('w'),name:w.name+' (copia)',codes:[],updatedAt:Date.now()}); state.workouts.push(c); state.currentId=c.id; touch(); render(); toast('Scheda duplicata'); };
$('#delBtn').onclick = ()=>{ const w = cur(); if(!w) return; const b = $('#delBtn');
  if (delArmed !== w.id){ delArmed = w.id; b.textContent='Conferma eliminazione'; setTimeout(()=>{ delArmed=null; b.textContent='Elimina'; },3000); return; }
  delArmed=null; b.textContent='Elimina'; state.workouts = state.workouts.filter(x=>x.id!==w.id); state.currentId = null; log('delete','Eliminata scheda «'+(w.name||'Senza nome')+'»',{clientId:w.clientId}); save(); go(ui.prevView||'home'); toast('Scheda eliminata'); };
$('#codeBtn').onclick = openCodeModal;
$('#catSearch').oninput = e=>{ ui.q=e.target.value; renderCatalogue(); };
document.querySelectorAll('#catSeg button').forEach(b=>b.onclick=()=>{ ui.catFilter=b.dataset.c; renderCatalogue(); });
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{ state.lang=b.dataset.l; save(); render(); });
document.addEventListener('click',ev=>{ if(ui.emojiOpen && !ev.target.closest('.emoji-pick')){ ui.emojiOpen=false; render(); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ $('#modalRoot').replaceChildren(); if(ui.emojiOpen){ ui.emojiOpen=false; render(); } } });
// cattura le modifiche ai campi senza perdere il focus: render completo solo su change
render();
</script>
